version: '3.8'

services:
  # --- Frontend (Angular + Nginx) ---
  frontend:
    build:
      context: ./Front-end/Market-Intelligence
      dockerfile: Dockerfile
    ports:
      - "4040:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: always

  # --- Backend (Flask + Gunicorn) ---
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      - QDRANT_HOST=qdrant_official
      - QDRANT_PORT=6333
      - DATABASE_PATH=/app/DB/market-intelligence.db
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      # Persist the SQLite Database
      - ./DB:/app/DB
      # Persist Uploads
      - ./Backend/uploads:/app/uploads
      # Mount Config files
      - ./Backend/.env:/app/.env
      - ./Backend/service-account.json:/app/service-account.json
      # Mount documents for synchronization
      - ./temp_upload:/app/temp_upload
    expose:
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      - qdrant_official
    networks:
      - app-network
    restart: always

  # --- Vector Database (Qdrant) ---
  qdrant_official:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  qdrant_storage:


