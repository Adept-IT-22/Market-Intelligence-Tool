version: '3.8'

services:
  # --- Frontend (Angular + Nginx) ---
  frontend:
    build:
      context: ./Front-end/Market-Intelligence
      dockerfile: Dockerfile
    ports:
      - "4040:80"
    depends_on:
      - backend
    networks:
      - app-network

  # --- Backend (Flask + Gunicorn) ---
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      # Persist the SQLite Database
      - ./Backend/DB:/app/DB
      # Persist Uploads
      - ./Backend/uploads:/app/uploads
      # Mount Config files (Allow updates without rebuild)
      - ./Backend/.env:/app/.env
      - ./Backend/service-account.json:/app/service-account.json
    expose:
      - "8000"
    depends_on:
      - qdrant
    networks:
      - app-network

  # --- Vector Database (Qdrant) ---
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  qdrant_storage:
