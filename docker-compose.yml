version: '3.8'

services:
  # --- Frontend (Angular + Nginx) ---
  frontend:
    build:
      context: ./Front-end/Market-Intelligence
      dockerfile: Dockerfile
    ports:
      - "4040:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: always

  # --- Backend (Flask + Gunicorn) ---
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    environment:
      - QDRANT_HOST=qdrant_official
      - QDRANT_PORT=6333
      - DATABASE_PATH=/app/DB/market-intelligence.db
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_PASSWORD=postgres_local_secure
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      # Persist the SQLite Database
      - ./DB:/app/DB
      # Persist Uploads
      - ./Backend/uploads:/app/uploads
      # Mount Config files
      - ./Backend/.env:/app/.env
      - ./Backend/service-account.json:/app/service-account.json
      # Mount documents for synchronization
      - ./temp_upload:/app/temp_upload
    expose:
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      - qdrant_official
      - postgres
      - redis
    networks:
      - app-network
    restart: always

  # --- Background Ingestion Worker ---
  worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    command: python scratch/run_simple_worker.py
    environment:
      - QDRANT_HOST=qdrant_official
      - QDRANT_PORT=6333
      - DATABASE_PATH=/app/DB/market-intelligence.db
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_PASSWORD=postgres_local_secure
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    dns:
      - 8.8.8.8
    volumes:
      - ./DB:/app/DB
      - ./Backend/uploads:/app/uploads
      - ./Backend/.env:/app/.env
      - ./Backend/service-account.json:/app/service-account.json
    depends_on:
      - redis
      - postgres
      - qdrant_official
    networks:
      - app-network
    restart: always

  # --- Vector Database (Qdrant) ---
  qdrant_official:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - app-network
    restart: always

  # --- Relational Metadata Database (PostgreSQL) ---
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=market_intelligence
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_local_secure
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: always

  # --- Cache & Task Queue (Redis) ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  qdrant_storage:
  postgres_data:


