<div class="sidebar-component" [ngClass]="{'closed': !isExpanded}">
    <div class="sidebar-header">
        <button class="toggle-btn" (click)="toggleSidebar()">
            <mat-icon>{{ isExpanded ? 'menu_open' : 'menu' }}</mat-icon>
        </button>
    </div>

    <div class="sidebar-content">
        <a *ngFor="let item of menuItems" [routerLink]="item.route" routerLinkActive="active"
            [routerLinkActiveOptions]="{exact: true}" class="nav-item">
            <mat-icon>{{item.icon}}</mat-icon>
            <span *ngIf="isExpanded">{{item.name}}</span>
        </a>
    </div>

    <div class="sidebar-footer" *ngIf="isExpanded">
        <p>&copy; 2026 El Gringo Analytics</p>
    </div>
</div>
