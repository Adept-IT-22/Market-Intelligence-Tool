<nav class="navbar">
    <div class="navbar-left">
        <a routerLink="/" class="product-text">
            EL GRINGO ANALYTICS
        </a>
    </div>

    <div class="nav-items">
        <button class="nav-link theme-toggle" (click)="toggleTheme()" title="Toggle Theme">
            <mat-icon>{{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>

        <!-- Auth Section -->
        <ng-container *ngIf="!auth.isAuthenticated(); else userMenu">
            <button class="login-btn" (click)="openLogin()">
                <mat-icon>login</mat-icon>
                <span>Sign In</span>
            </button>
        </ng-container>

        <ng-template #userMenu>
            <button class="user-profile-btn" [matMenuTriggerFor]="profileMenu">
                <div class="avatar" [style.background]="'var(--accent-gradient)'">
                    {{ (auth.currentUser()?.displayName || auth.currentUser()?.email || 'U')[0].toUpperCase() }}
                </div>
                <mat-icon>expand_more</mat-icon>
            </button>

            <mat-menu #profileMenu="matMenu" class="modern-menu" xPosition="before">
                <div class="menu-header">
                    <div class="header-avatar-wrapper">
                        <div class="header-avatar" [style.background]="'var(--accent-gradient)'">
                            {{ (auth.currentUser()?.displayName || auth.currentUser()?.email || 'U')[0].toUpperCase() }}
                        </div>
                        <div class="status-indicator"></div>
                    </div>
                    <div class="header-info">
                        <div class="name-row">
                            <p class="name">{{ auth.currentUser()?.displayName || 'Research User' }}</p>
                            <span class="role-badge">Pro</span>
                        </div>
                        <p class="email">{{ auth.currentUser()?.email }}</p>
                    </div>
                </div>

                <div class="menu-sections">
                    <div class="menu-section">
                        <span class="section-title">Account</span>
                        <button mat-menu-item>
                            <mat-icon>person</mat-icon>
                            <span>My Profile</span>
                        </button>
                        <button mat-menu-item>
                            <mat-icon>settings</mat-icon>
                            <span>Settings</span>
                        </button>
                    </div>

                    <div class="menu-section">
                        <span class="section-title">Resources</span>
                        <button mat-menu-item>
                            <mat-icon>auto_awesome</mat-icon>
                            <span>Usage Statistics</span>
                        </button>
                        <button mat-menu-item>
                            <mat-icon>help_center</mat-icon>
                            <span>Help Center</span>
                        </button>
                    </div>

                    <div class="menu-footer">
                        <button mat-menu-item (click)="logout()" class="logout-item">
                            <mat-icon>logout</mat-icon>
                            <span>Sign Out</span>
                        </button>
                    </div>
                </div>
            </mat-menu>
        </ng-template>
    </div>
</nav>
