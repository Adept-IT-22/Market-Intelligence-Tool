server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Allow file uploads up to 10MB (matches backend limit)
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    # Assuming backend service name in docker-compose is 'backend'
    location /api/ {
        # Create a rewrite to match backend routes if they don't start with /api
        # But our backend endpoints like /query, /auth/login might not have /api prefix if strict
        # Let's check main.py. It has /auth, /chats, /query directly on root.
        # So we proxy pass strictly.
        
        # If the frontend calls /api/auth/login, we want it to go to http://backend:8000/auth/login
        rewrite ^/api/(.*) /$1 break;
        
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # SSE / Streaming support
        proxy_buffering off;
        proxy_set_header Cache-Control no-cache;
        
        # Increase timeouts for long-running AI queries
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}
